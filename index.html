<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sibishan Ravindran</title>
<meta name="description" content="Sibishan Ravindran is honours student at UTS working on quantum circuit compilation for distributed quantum computers.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#E8ECF0;
    --panel:#F1F4F7;
    --ink:#0E1622;
    --muted:#5A6674;
    --rule:#C5CED8;
    --signal:#C41E63;
    --link:#17697A;

    --mono:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans:"IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  *{ box-sizing:border-box; }

  html,body{ margin:0; padding:0; }

  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
    min-height:100svh;
    display:flex;
    flex-direction:column;
    padding:clamp(20px,4.5vw,64px);
    gap:clamp(28px,5vw,56px);
  }

  /* ---------- masthead ---------- */

  .masthead{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap:16px;
    flex-wrap:wrap;
    padding-bottom:14px;
    border-bottom:1px solid var(--rule);
  }

  .wordmark{
    font-family:var(--mono);
    font-size:13px;
    letter-spacing:.14em;
    text-transform:uppercase;
    font-weight:500;
  }

  .status{
    font-family:var(--mono);
    font-size:12px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--muted);
  }

  .caret{
    display:inline-block;
    width:.55em; height:1em;
    background:var(--signal);
    vertical-align:-.15em;
    margin-left:.4em;
    animation:blink 1.1s steps(1,end) infinite;
  }

  @keyframes blink{ 50%{ opacity:0; } }

  /* ---------- main ---------- */

  .stage{
    flex:1;
    display:grid;
    grid-template-columns:1.05fr .95fr;
    gap:clamp(32px,6vw,72px);
    align-items:center;
  }

  h1{
    margin:0;
    font-weight:600;
    font-size:clamp(2.9rem,10.5vw,6.2rem);
    line-height:.9;
    letter-spacing:-.035em;
  }

  h1 .soft{ color:var(--muted); }

  .lede{
    margin:1.4rem 0 0;
    max-width:36ch;
    font-size:clamp(1rem,1.35vw,1.1rem);
    line-height:1.6;
    color:var(--muted);
  }

  .lede strong{ color:var(--ink); font-weight:500; }

  /* ---------- lattice panel ---------- */

  .panel{
    background:var(--panel);
    border:1px solid var(--rule);
    padding:clamp(18px,2.6vw,28px);
    display:flex;
    flex-direction:column;
    gap:16px;
  }

  .panel-head{
    display:flex;
    justify-content:space-between;
    gap:12px;
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--muted);
  }

  svg.lattice{ width:100%; height:auto; display:block; }

  .readout{
    font-family:var(--mono);
    font-size:12.5px;
    color:var(--ink);
    border-top:1px solid var(--rule);
    padding-top:12px;
    min-height:2.6em;
    line-height:1.5;
  }

  .readout .op{ color:var(--signal); }
  .readout .tele{ color:var(--link); }

  /* ---------- footer ---------- */

  .footer{
    display:flex;
    gap:clamp(16px,3vw,32px);
    flex-wrap:wrap;
    align-items:center;
    padding-top:14px;
    border-top:1px solid var(--rule);
    font-family:var(--mono);
    font-size:12.5px;
  }

  .footer a{
    color:var(--ink);
    text-decoration:none;
    border-bottom:1px solid var(--rule);
    padding-bottom:2px;
    transition:color .18s ease, border-color .18s ease;
  }

  .footer a:hover,
  .footer a:focus-visible{
    color:var(--signal);
    border-color:var(--signal);
  }

  .footer .spacer{ margin-left:auto; color:var(--muted); }

  :focus-visible{ outline:2px solid var(--signal); outline-offset:3px; }

  @media (max-width:880px){
    .stage{ grid-template-columns:1fr; align-items:start; gap:36px; }
    .footer .spacer{ margin-left:0; width:100%; }
  }

  @media (prefers-reduced-motion:reduce){
    .caret{ animation:none; }
  }
</style>
</head>
<body>

  <header class="masthead">
    <div class="wordmark">Sibishan Ravindran</div>
    <div class="status">Building<span class="caret" aria-hidden="true"></span></div>
  </header>

  <main class="stage">
    <div>
      <h1>Under<br><span class="soft">construction</span></h1>
      <p class="lede">
        A portfolio is being assembled here. I'm a computing science honours student
        working on <strong>qubit mapping and routing for distributed quantum architectures</strong>.
      </p>
    </div>

    <section class="panel" aria-label="Animated diagram of a qubit routing through a four-core lattice">
      <div class="panel-head">
        <span>Architecture G</span>
        <span>2&times;2 cores &middot; 4&times;4 qubits</span>
      </div>

      <svg class="lattice" id="lattice" viewBox="-6 -6 252 252" role="img"
           aria-label="A qubit hops between neighbouring slots inside each core and teleports across buffered links between cores.">
      </svg>

      <div class="readout" id="readout">&nbsp;</div>
    </section>
  </main>

  <footer class="footer">
    <a href="https://github.com/sibishan">GitHub</a>
    <!-- Replace the two below, or delete them. -->
    <a href="mailto:sibishanr@outlook.com">Email</a>
    <a href="https://www.linkedin.com/in/sibishanr">LinkedIn</a>
    <span class="spacer">Last updated Aug. 2026</span>
  </footer>

<script>
(function(){
  const NS = "http://www.w3.org/2000/svg";
  const svg = document.getElementById("lattice");
  const readout = document.getElementById("readout");

  const CORES = [{x:0,y:0},{x:140,y:0},{x:0,y:140},{x:140,y:140}];
  const STEP = 20, OFF = 20;

  const slot = (c,col,row) => ({
    x: CORES[c].x + OFF + col*STEP,
    y: CORES[c].y + OFF + row*STEP,
    id: row*4 + col,
    core: c
  });

  function el(name, attrs){
    const n = document.createElementNS(NS, name);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    return n;
  }

  // ---- static structure -------------------------------------------------

  const gStatic = el("g", {});
  svg.appendChild(gStatic);

  CORES.forEach(c => {
    gStatic.appendChild(el("rect", {
      x:c.x, y:c.y, width:100, height:100,
      fill:"none", stroke:"var(--rule)", "stroke-width":1
    }));
    for (let row=0; row<4; row++){
      for (let col=0; col<4; col++){
        const p = { x:c.x + OFF + col*STEP, y:c.y + OFF + row*STEP };
        gStatic.appendChild(el("circle", {
          cx:p.x, cy:p.y, r:1.7, fill:"var(--rule)"
        }));
      }
    }
  });

  // buffered interconnects between neighbouring cores
  const LINKS = [
    [{x:100,y:50},{x:140,y:50}],
    [{x:50,y:100},{x:50,y:140}],
    [{x:190,y:100},{x:190,y:140}],
    [{x:100,y:190},{x:140,y:190}]
  ];

  LINKS.forEach(([a,b]) => {
    gStatic.appendChild(el("line", {
      x1:a.x, y1:a.y, x2:b.x, y2:b.y,
      stroke:"var(--link)", "stroke-width":1, "stroke-dasharray":"3 3", opacity:.55
    }));
    [a,b].forEach(p => gStatic.appendChild(el("rect", {
      x:p.x-2.6, y:p.y-2.6, width:5.2, height:5.2,
      fill:"var(--panel)", stroke:"var(--link)", "stroke-width":1
    })));
  });

  // ---- the route --------------------------------------------------------

  const segments = [];
  let cursor = null;

  function start(p){ cursor = p; }

  function swapTo(p){
    segments.push({
      a:cursor, b:p, dur:430, kind:"swap",
      label:`<span class="op">swap</span> q${cursor.id} &harr; q${p.id} <span style="color:var(--muted)">core ${p.core}</span>`
    });
    cursor = p;
  }

  function teleportTo(p, via){
    const label = `<span class="tele">teleport</span> core ${cursor.core} &rarr; ${p.core} <span style="color:var(--muted)">buffered epr</span>`;
    const chain = [via[0], via[1], p];
    chain.forEach((next, i) => {
      segments.push({
        a:cursor, b:next, dur:i===1 ? 420 : 220, kind:"tele",
        label, silent:i>0
      });
      cursor = next;
    });
  }

  start(slot(0,0,0));
  swapTo(slot(0,1,0));
  swapTo(slot(0,1,1));
  swapTo(slot(0,2,1));
  swapTo(slot(0,3,1));
  teleportTo(slot(1,0,1), [{x:100,y:50,id:-1,core:0},{x:140,y:50,id:-1,core:1}]);
  swapTo(slot(1,1,1));
  swapTo(slot(1,1,2));
  swapTo(slot(1,2,2));
  swapTo(slot(1,2,3));
  teleportTo(slot(3,2,0), [{x:190,y:100,id:-1,core:1},{x:190,y:140,id:-1,core:3}]);
  swapTo(slot(3,1,0));
  swapTo(slot(3,1,1));
  swapTo(slot(3,0,1));
  teleportTo(slot(2,3,1), [{x:140,y:190,id:-1,core:3},{x:100,y:190,id:-1,core:2}]);
  swapTo(slot(2,3,0));
  swapTo(slot(2,2,0));

  const target = cursor;

  // faint full route
  const allPts = [segments[0].a, ...segments.map(s => s.b)];
  gStatic.appendChild(el("polyline", {
    points: allPts.map(p => `${p.x},${p.y}`).join(" "),
    fill:"none", stroke:"var(--rule)", "stroke-width":1
  }));

  // target marker
  gStatic.appendChild(el("circle", {
    cx:target.x, cy:target.y, r:5,
    fill:"none", stroke:"var(--ink)", "stroke-width":1
  }));

  // ---- animated layer ---------------------------------------------------

  const trail = el("polyline", {
    fill:"none", stroke:"var(--signal)", "stroke-width":1.8,
    "stroke-linecap":"round", "stroke-linejoin":"round"
  });
  svg.appendChild(trail);

  const halo = el("circle", { r:6.5, fill:"var(--signal)", opacity:.18 });
  const dot  = el("circle", { r:3.2, fill:"var(--signal)" });
  svg.appendChild(halo);
  svg.appendChild(dot);

  function place(p){
    dot.setAttribute("cx", p.x);  dot.setAttribute("cy", p.y);
    halo.setAttribute("cx", p.x); halo.setAttribute("cy", p.y);
  }

  const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  if (reduced){
    trail.setAttribute("points", allPts.map(p => `${p.x},${p.y}`).join(" "));
    place(target);
    readout.innerHTML = `<span class="op">route</span> resolved &middot; ${segments.filter(s=>s.kind==="swap").length} swaps &middot; 3 teleports`;
    return;
  }

  let seg = 0, t0 = null, done = [segments[0].a];
  const HOLD = 1400;

  function draw(){
    const pts = done.map(p => `${p.x},${p.y}`);
    trail.setAttribute("points", pts.join(" "));
  }

  function frame(ts){
    if (t0 === null) t0 = ts;
    const s = segments[seg];
    const k = Math.min(1, (ts - t0) / s.dur);
    const e = k < .5 ? 2*k*k : 1 - Math.pow(-2*k + 2, 2)/2;

    const x = s.a.x + (s.b.x - s.a.x) * e;
    const y = s.a.y + (s.b.y - s.a.y) * e;
    place({x, y});

    halo.setAttribute("opacity", s.kind === "tele" ? .18 + .3*Math.sin(k*Math.PI) : .18);

    const pts = done.map(p => `${p.x},${p.y}`).concat(`${x},${y}`);
    trail.setAttribute("points", pts.join(" "));

    if (!s.silent && k < .05) readout.innerHTML = s.label;

    if (k >= 1){
      done.push(s.b);
      draw();
      seg++;
      t0 = null;
      if (seg >= segments.length){
        readout.innerHTML = `<span class="op">route</span> resolved &middot; restarting`;
        setTimeout(() => {
          seg = 0; done = [segments[0].a]; draw();
          requestAnimationFrame(frame);
        }, HOLD);
        return;
      }
    }
    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
